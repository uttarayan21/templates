name: templates

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Check registry evaluates
        run: nix eval --json '.#om' >/dev/null

      - name: Scaffold every template
        run: nix run github:juspay/omnix -- init --test .

      - name: Check placeholder substitution
        run: |
          nix shell github:juspay/omnix -c \
            python3 scripts/check_placeholder.py
